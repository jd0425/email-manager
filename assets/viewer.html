<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox Catalog</title>
<style>
  :root {
    --bg: #f5f6f7; --panel: #ffffff; --border: #e2e4e8; --text: #14171a;
    --muted: #666d76; --accent: #0f9488; --accent-text: #ffffff;
    --warn: #b45309; --warn-bg: #fdf1e0;
    --chip-bg: #eceef1; --row-hover: #f1f3f5;
    --mono: "SF Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1113; --panel: #12181b; --border: #232b2f; --text: #eef1f2;
      --muted: #8b959b; --accent: #2dd4bf; --accent-text: #0d1113;
      --warn: #f0a03c; --warn-bg: #2c2013;
      --chip-bg: #1b2226; --row-hover: #182022;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 var(--sans);
  }
  header {
    padding: 20px 24px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap;
  }
  header .titleblock h1 { margin: 0 0 2px; font-size: 19px; font-weight: 650; }
  header .sub { margin: 0; color: var(--muted); font-size: 12.5px; }
  header .meta {
    text-align: right; color: var(--muted); font: 12px/1.5 var(--mono);
    white-space: nowrap;
  }
  .bar { padding: 0 24px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 14px; padding: 0 24px; }
  .stat {
    background: var(--chip-bg); border-radius: 10px; padding: 8px 14px; min-width: 108px;
  }
  .stat.warn { background: var(--warn-bg); color: var(--warn); }
  .stat .n { font: 700 18px/1.3 var(--mono); font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat.warn .l { color: var(--warn); opacity: .85; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  select, input[type="search"] {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 13px;
  }
  .range-btns { display: flex; gap: 4px; flex-wrap: wrap; }
  .range-btns button {
    background: var(--chip-bg); color: var(--text); border: none; border-radius: 8px;
    padding: 6px 10px; font-size: 12.5px; cursor: pointer;
  }
  .range-btns button.active { background: var(--accent); color: var(--accent-text); }
  .search-wrap { flex: 1 1 220px; min-width: 180px; }
  .search-wrap input { width: 100%; }
  main { padding: 16px 24px 40px; }
  .count { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
  .table-wrap {
    background: var(--panel); border-radius: 10px; border: 1px solid var(--border);
    overflow-x: auto; overflow-y: visible; max-width: 100%;
  }
  table { width: 100%; min-width: 920px; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .03em;
    color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border);
    cursor: pointer; white-space: nowrap; position: sticky; top: 0; background: var(--panel);
  }
  thead th:hover { color: var(--text); }
  tbody td {
    padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top;
    max-width: 320px; overflow: hidden; text-overflow: ellipsis;
  }
  tbody tr:hover { background: var(--row-hover); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
    background: var(--chip-bg);
  }
  .badge.needs_review { background: var(--warn-bg); color: var(--warn); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<header>
  <div class="titleblock">
    <h1>Inbox Catalog</h1>
    <p class="sub">Inbox triage log &mdash; read-only snapshot, rebuilt after each batch (see build_viewer.py)</p>
  </div>
  <div class="meta" id="headerMeta">0 messages cataloged</div>
</header>
<div class="bar">
  <div class="stats">
    <div class="stat"><div class="n" id="statInView">0</div><div class="l">in view</div></div>
    <div class="stat"><div class="n" id="statTotal">0</div><div class="l">total cataloged</div></div>
    <div class="stat warn"><div class="n" id="statReview">0</div><div class="l">needs review</div></div>
    <div class="stat"><div class="n" id="statCleared">0</div><div class="l">auto-cleared</div></div>
  </div>
  <div class="controls">
    <div class="range-btns" id="rangeBtns">
      <button data-days="1">24h</button>
      <button data-days="3">3d</button>
      <button data-days="7" class="active">7d</button>
      <button data-days="30">30d</button>
      <button data-days="90">90d</button>
      <button data-days="0">All</button>
    </div>
    <select id="categoryFilter">
      <option value="">All categories</option>
    </select>
    <select id="statusFilter">
      <option value="">All statuses</option>
    </select>
    <select id="acctFilter">
      <option value="">All accounts</option>
    </select>
    <div class="search-wrap">
      <input type="search" id="search" placeholder="Search subject / sender / notes&hellip;">
    </div>
  </div>
</div>
<main>
  <div class="count" id="count"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-key="d">Date</th>
          <th data-key="acct" class="acct-col">Account</th>
          <th data-key="f">From</th>
          <th data-key="a">To</th>
          <th data-key="s">Subject</th>
          <th data-key="c">Category</th>
          <th data-key="sa">Sub-action</th>
          <th data-key="st">Status</th>
          <th data-key="due">Due</th>
          <th data-key="amt">Amount</th>
          <th data-key="n">Notes</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="empty" id="emptyMsg" style="display:none">No messages match the current filters.</div>
</main>

<script id="catalog-data" type="application/json">[]</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('catalog-data').textContent || '[]');
  var NEWEST = new Date('2026-01-01T00:00:00');

  var state = { cat: '', status: '', acct: '', days: 7, q: '', sortKey: 'd', sortDir: -1 };

  var ACCOUNTS = {};
  DATA.forEach(function (r) { if (r.acct) ACCOUNTS[r.acct] = true; });
  var MULTI_ACCOUNT = Object.keys(ACCOUNTS).length > 1;
  if (!MULTI_ACCOUNT) {
    var acctFilterEl = document.getElementById('acctFilter');
    if (acctFilterEl) acctFilterEl.style.display = 'none';
    document.querySelectorAll('.acct-col').forEach(function (el) { el.style.display = 'none'; });
  }

  function within(dateStr, days) {
    if (!days) return true;
    if (!dateStr) return false;
    var d = new Date(dateStr + 'T00:00:00');
    var cutoff = new Date(NEWEST);
    cutoff.setDate(cutoff.getDate() - days);
    return d >= cutoff;
  }

  function filtered() {
    var q = state.q.trim().toLowerCase();
    return DATA.filter(function (r) {
      if (state.cat && r.c !== state.cat) return false;
      if (state.status && r.st !== state.status) return false;
      if (state.acct && r.acct !== state.acct) return false;
      if (!within(r.d, state.days)) return false;
      if (q) {
        var hay = (r.s + ' ' + r.f + ' ' + r.n).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sorted(rows) {
    var k = state.sortKey, dir = state.sortDir;
    return rows.slice().sort(function (a, b) {
      var av = (a[k] || ''), bv = (b[k] || '');
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
  }

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render() {
    var rows = sorted(filtered());
    var tbody = document.getElementById('rows');
    document.getElementById('statInView').textContent = rows.length.toLocaleString();
    document.getElementById('count').textContent = rows.length.toLocaleString() + ' message' + (rows.length === 1 ? '' : 's');
    document.getElementById('emptyMsg').style.display = rows.length ? 'none' : 'block';
    tbody.innerHTML = rows.map(function (r) {
      var statusBadge = '<span class="badge ' + esc(r.st) + '">' + esc(r.st) + '</span>';
      return '<tr>' +
        '<td>' + esc(r.d) + '</td>' +
        '<td class="acct-col">' + esc(r.acct) + '</td>' +
        '<td>' + esc(r.f) + '</td>' +
        '<td>' + esc(r.a) + '</td>' +
        '<td>' + esc(r.s) + '</td>' +
        '<td>' + esc(r.c) + '</td>' +
        '<td>' + esc(r.sa) + '</td>' +
        '<td>' + statusBadge + '</td>' +
        '<td>' + esc(r.due) + '</td>' +
        '<td>' + esc(r.amt) + '</td>' +
        '<td>' + esc(r.n) + '</td>' +
        '</tr>';
    }).join('');
  }

  // Category
  document.getElementById('categoryFilter').addEventListener('change', function (e) {
    state.cat = e.target.value;
    render();
  });

  // Status
  document.getElementById('statusFilter').addEventListener('change', function (e) {
    state.status = e.target.value;
    render();
  });

  // Account
  document.getElementById('acctFilter').addEventListener('change', function (e) {
    state.acct = e.target.value;
    render();
  });

  // Range
  document.getElementById('rangeBtns').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll('#rangeBtns button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    state.days = parseInt(btn.getAttribute('data-days'), 10);
    render();
  });

  // Search
  document.getElementById('search').addEventListener('input', function (e) {
    state.q = e.target.value;
    render();
  });

  // Sort
  document.querySelectorAll('thead th').forEach(function (th) {
    th.addEventListener('click', function () {
      var key = th.getAttribute('data-key');
      if (state.sortKey === key) { state.sortDir *= -1; }
      else { state.sortKey = key; state.sortDir = 1; }
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
